name: PushWarden release

# Push a tag like pushwarden-v0.1.0 to build a signed F-Droid-flavor APK and attach it to a GitHub release.
on:
  push:
    tags: ["pushwarden-v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # settings.gradle.kts reads it for Bitwarden's SDK on GitHub Packages

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android-build

      - name: Build
        # shortcut: versionCode stays at gradle/libs.versions.toml's value; bump it there per release.
        run: ./gradlew :app:assembleFdroidRelease

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # The release build type has no signingConfig, so sign here; a key in the repo would let anyone ship an "update".
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS secrets"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          mkdir -p dist
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --out "dist/pushwarden-${GITHUB_REF_NAME}.apk" app/build/outputs/apk/fdroid/release/*.apk
          "$apksigner" verify --print-certs "dist/pushwarden-${GITHUB_REF_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber || gh release create "$GITHUB_REF_NAME" dist/*.apk --generate-notes
